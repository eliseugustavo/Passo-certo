<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Passo certo</title>
  <style>
    :root {
      --yellow: #FBD343;
      --green: #2E6B50;
      --deep: #1B4332;
      --mint: #D8F3DC;
      --page: #D8F3DC;
      --ink: #1B4332;
      --panel: #2E6B50;
      --sc: 1;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --page: #0F2419;
        --ink: #D8F3DC;
        --panel: #1F4A37;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --page: #0F2419;
      --ink: #D8F3DC;
      --panel: #1F4A37;
      color-scheme: dark
    }

    html {
      font-size: calc(100% * var(--sc));
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 1.2rem/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto
    }

    header {
      background: var(--yellow);
      border-radius: 0 0 28px 0;
      padding: 0 16px
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start
    }

    .fs {
      display: flex;
      gap: 6px;
      padding-top: 12px
    }

    .fs button {
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      background: var(--deep);
      color: #fff;
      border: 0;
      border-radius: 12px;
      min-width: 48px;
      min-height: 44px;
      cursor: pointer
    }

    .brand {
      background: var(--deep);
      color: #fff;
      font-size: 1.7rem;
      padding: 8px 20px 14px;
      border-radius: 0 0 22px 22px
    }

    nav {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      align-items: flex-end;
      overflow-x: auto;
      scrollbar-width: none
    }

    nav::-webkit-scrollbar {
      display: none
    }

    nav button {
      font: inherit;
      font-size: 1.05rem;
      white-space: nowrap;
      background: #fff;
      color: #111;
      border: 0;
      padding: 10px 16px 8px;
      border-radius: 14px 14px 0 0;
      cursor: pointer;
      min-height: 48px
    }

    nav button[aria-selected="true"] {
      background: var(--panel);
      color: #fff;
      padding-top: 20px
    }

    button:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 4px solid #000;
      outline-offset: 2px
    }

    .badge {
      background: var(--yellow);
      color: var(--deep);
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 700;
      padding: 0 8px;
      margin-left: 6px
    }

    main {
      background: var(--panel);
      margin: 0 16px;
      padding: 22px 18px 32px;
      border-radius: 0 0 36px 36px;
      min-height: 70vh;
      color: #fff
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 14px;
      line-height: 1.25
    }

    h2.lv {
      font-size: 1.3rem;
      margin: 22px 0 4px
    }

    .sub {
      margin: 0 0 12px;
      font-size: 1rem;
      opacity: .9
    }

    .back {
      font: inherit;
      font-size: 1rem;
      background: var(--mint);
      color: var(--deep);
      border: 0;
      border-radius: 99px;
      padding: 8px 18px;
      min-height: 44px;
      cursor: pointer;
      margin-bottom: 18px
    }

    .card,
    .mini,
    details {
      background: var(--mint);
      color: var(--deep);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 1.3rem;
      line-height: 1.2
    }

    .card p {
      margin: 0 0 12px;
      font-size: 1rem
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .8rem;
      font-weight: 700;
      margin-bottom: 10px
    }

    .bar {
      flex: 0 0 110px;
      height: 8px;
      border-radius: 9px;
      background: #fff
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--green);
      border-radius: 9px
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .chip {
      background: #fff;
      color: var(--deep);
      border-radius: 99px;
      font-size: .85rem;
      padding: 4px 12px;
      font-weight: 600
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .btn {
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: 0;
      border-radius: 16px;
      padding: 12px 18px;
      min-height: 52px;
      cursor: pointer;
      background: #fff;
      color: var(--deep);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none
    }

    .btn.fav {
      background: var(--yellow)
    }

    .btn.main {
      background: var(--deep);
      color: #fff
    }

    .btn.wa {
      background: #25D366;
      color: #073B1B
    }

    .play {
      border-left: 14px solid var(--green);
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent
    }

    .mini {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 20px;
      margin-bottom: 10px
    }

    .mini b {
      display: block;
      font-size: 1.05rem;
      line-height: 1.25
    }

    .mini small {
      font-size: .8rem;
      font-weight: 600
    }

    .mini .btn {
      padding: 8px 12px;
      min-height: 46px;
      font-size: .95rem
    }

    .lvbtn {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      font: inherit;
      background: var(--mint);
      color: var(--deep);
      border: 0;
      border-radius: 22px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      min-height: 68px
    }

    .lvbtn .e {
      font-size: 1.8rem
    }

    .lvbtn b {
      display: block;
      font-size: 1.1rem
    }

    .lvbtn small {
      font-size: .85rem
    }

    .video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--deep);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
}

   .video iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

    .video p {
    padding: 20px;
    text-align: center;
}

    .steps {
      background: #fff;
      color: var(--deep);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px
    }

    .steps h3 {
      margin: 0 0 4px;
      font-size: 1.3rem
    }

    .step {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      font: inherit;
      font-size: 1.05rem;
      background: var(--mint);
      color: var(--deep);
      border: 0;
      border-radius: 18px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      min-height: 56px
    }

    .num {
      flex: 0 0 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--deep);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: .95rem
    }

    .step[aria-pressed="true"] {
      background: #B7E4C7
    }

    .step[aria-pressed="true"] .num {
      background: var(--green)
    }

    .step[aria-pressed="true"] .txt {
      text-decoration: line-through
    }

    .safe {
      background: var(--yellow);
      color: var(--deep);
      border-radius: 18px;
      padding: 14px 16px;
      margin: 14px 0
    }

    .safe b {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 6px
    }

    .safe ul {
      margin: 0;
      padding-left: 22px;
      font-size: 1rem
    }

    details {
      padding: 0
    }

    details summary {
      padding: 16px 18px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      min-height: 56px
    }

    details p {
      margin: 0;
      padding: 0 18px 16px;
      font-size: 1rem
    }

    .empty {
      font-size: 1.1rem
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="top">
        <div class="fs" role="group" aria-label="Tamanho da letra"><button data-sc="-1"
            aria-label="Diminuir letra">A−</button><button data-sc="1" aria-label="Aumentar letra">A+</button></div>
        <div class="brand">Passo certo</div>
      </div>
      <nav role="tablist" aria-label="Seções">
        <button role="tab" data-tab="home">Página inicial</button>
        <button role="tab" data-tab="trilhas">Trilhas</button>
        <button role="tab" data-tab="seen">Assistidos</button>
        <button role="tab" data-tab="favs">Favoritos<span class="badge" id="fc" hidden></span></button>
        <button role="tab" data-tab="safe">Segurança</button>
        <button role="tab" data-tab="help">Ajuda</button>
      </nav>
    </header>
    <main id="app" aria-live="polite"></main>
  </div>
  <script>
    var LV = [{ e: '🌱', n: 'Primeiros passos', d: 'O básico do celular' }, { e: '📱', n: 'No dia a dia', d: 'WhatsApp e rotina' }, { e: '🛡️', n: 'Com mais cuidado', d: 'Dinheiro e banco' }];
    var T = [
      { id: 'letras', 
      l: 0,
      t: 'Aumentar letras e ícones',
      d: 'Deixe tudo maior e mais fácil de ler.', 
      youtube: '',
      m: 2, 
      s: ['Abra “Configurações” (ícone de engrenagem).',
       'Toque em “Tela”.', 'Toque em “Tamanho da fonte” e arraste para a direita.', 
       'Confira se ficou bom e toque em “Aplicar”.'] },

      { id: 'wifi',
      l: 0, 
      t: 'Ligar Wi-Fi, dados, Bluetooth e GPS', 
      d: 'Use o atalho no topo da tela.', 
      youtube: '',
      m: 2, 
      s: ['Deslize o dedo de cima para baixo na tela.', 
      'Toque no ícone que quer ligar: ele fica colorido.', 
      'Toque de novo para desligar.'] },

      { id: 'volume',
      l: 0,
      t: 'Volume e toque das chamadas', 
      d: 'Faça o celular tocar mais alto.', 
      youtube:'',
      m: 2, 
      s: ['Aperte o botão de volume na lateral.', 
      'Toque na setinha para abrir todas as opções.', 
      'Arraste a barra “Toque” para a direita.'] },

      { id: 'print', 
      l: 0, 
      t: 'Tirar print da tela', 
      d: 'Guarde uma imagem do que aparece no celular.', 
      youtube: '',
      m: 1, 
      s: ['Deixe na tela o que quer guardar.', 
      'Aperte juntos o botão de ligar e o de baixar o volume.', 
      'Pronto! A imagem fica salva na Galeria.'] },

      { id: 'audio', 
      l: 1, 
      t: 'Enviar e ouvir áudios no WhatsApp', 
      d: 'Fale em vez de digitar.', 
      youtube: '',
      m: 2, 
      s: ['Abra a conversa.', 
      'Segure o dedo no ícone do microfone e fale.', 
      'Solte para enviar.', 
      'Para ouvir, toque no triângulo do áudio recebido.'] },

      { id: 'video', 
      l: 1, 
      t: 'Videochamada com a família', 
      d: 'Veja quem você ama pela tela.',
      youtube: '',
      m: 2, 
      s: ['Abra a conversa com a pessoa.', 
      'Toque na câmera de vídeo, no topo da tela.', 
      'Aguarde a pessoa atender.'] },

      { id: 'local', 
      l: 1, 
      t: 'Enviar localização pelo WhatsApp',
      d: 'Mostre onde você está.',
      youtube: '',
      m: 2, 
      s: ['Abra a conversa.', 
      'Toque no clipe (ou no sinal de +).', 
      'Toque em “Localização”.', 
      'Toque em “Enviar localização atual”.'], 
      safe: ['Só envie sua localização para quem você conhece.'] },

      { id: 'copiar', 
      l: 1, 
      t: 'Copiar e colar', 
      d: 'Leve um texto de um lugar para outro.', 
      youtube: '',
      m: 2, 
      s: ['Segure o dedo sobre o texto até ele ficar marcado.', 
      'Toque em “Copiar”.', 'Toque no campo onde quer colocar o texto.', 
      'Segure o dedo e toque em “Colar”.'] },

      { id: 'pix', 
      l: 2, 
      t: 'Como realizar um Pix',
      d: 'Tutorial prático para aprender a enviar dinheiro com segurança.', 
      youtube: '',
      m: 2, 
      h: '5 passos para enviar com segurança', 
      s: ['Abra o banco.', 'Procure o botão escrito “Pix” e toque nele.', 
      'Toque em “Pagar” ou “Transferir” e digite a chave (telefone, CPF ou e-mail).', 
      'Confira o NOME de quem vai receber. Se não for a pessoa certa, pare aqui.',
      'Digite o valor e confirme com sua senha.'], safe: ['Confirme o nome do destinatário antes de enviar.', 
      'Use sempre a chave certa (telefone, CPF ou e-mail).', 'Revise valor e senha antes de confirmar.'] },

      { id: 'banco', 
      l: 2, 
      t: 'Como usar o aplicativo do banco', 
      d: 'Aprenda a navegar, encontrar serviços e usar atalhos com segurança.', 
      youtube: '',
      m: 4, s: ['Abra o aplicativo do seu banco.', 'Entre com sua senha ou digital.', 
      'Toque em “Extrato” para ver o que entrou e saiu.', 'Para sair, toque em “Sair”.'], 
      safe: ['Nunca passe sua senha para ninguém, nem por telefone.'] },

      { id: 'contas', 
      l: 2, 
      t: 'Como pagar contas pelo celular',
      d: 'Veja como ler o código, confirmar valores e concluir pagamentos com tranquilidade.', 
      youtube: '',
      m: 3, s: ['No app do banco, toque em “Pagar”.', 
      'Toque em “Ler código de barras” e aponte a câmera para o boleto.', 
      'Confira o valor e o nome de quem vai receber.', 'Confirme com sua senha.'], 
      safe: ['Desconfie de boletos recebidos por mensagem.'] }

    ];
    var tab = 'home', open = null, S = {}, sc = 1;

    try { S = JSON.parse(localStorage.getItem('pc') || '{}'); sc = +localStorage.getItem('pcsc') || 1 } catch (e) { }
    
    function st(i) { 
      return S[i] || (S[i] = { fav: false, op: false, done: [] }) 
    }
    
    function sv() { 
      try { localStorage.setItem('pc', JSON.stringify(S)); 
      localStorage.setItem('pcsc', sc) } catch (e) { } 
    }
    
    function get(i) { 
      return T.filter(function (t) { 
        return t.id === i })[0] 
      }

    function extrairId(url) {
    try {
        const u = new URL(url);

        if (u.hostname === "youtu.be") {
            return u.pathname.slice(1);
        }
        return u.searchParams.get("v") ||
               u.pathname.split("/").pop();
    } catch (e) {
        return "";
    }
}
    function fin(t) { 
      return st(t.id).done.length === t.s.length 
    }
    
    function pct(t) {
       return fin(t) ? 100 : Math.max(st(t.id).done.length / t.s.length * 100, 18)
      }
    
    function status(t) { 
      return st(t.id).op ? '<div class="status"><div class="bar"><i style="width:' + pct(t) + '%"></i></div>' + (fin(t) ? 'Concluído' : 'Assistido parcialmente') + '</div>' : ''
     }
    
    function favb(t) { 
      var f = st(t.id).fav; 
      return '<button class="btn ' + (f ? 'fav' : '') + '" data-fav="' + t.id + '">' + (f ? '★ Remover dos favoritos' : '☆ Favoritar') + '</button>'
     }
    
    function card(t) { 
      return '<article class="card">' + status(t) + '<h2>' + t.t + '</h2><p>' + t.d + '</p><div class="chips"><span class="chip">● ' + t.s.length + ' passos escritos</span><span class="chip">Duração: ' + t.m + ' min</span></div><div class="row"><button class="btn" data-open="' + t.id + '"><i class="play"></i>Assistir</button>' + favb(t) + '</div></article>' 
    }
    
    function mini(t) { 
      var f = st(t.id).fav; 
      return '<div class="mini"><div><b>' + t.t + '</b><small>' + (fin(t) ? '✓ Concluído' : st(t.id).op ? 'Em andamento' : t.m + ' min') + '</small></div><div class="row" style="flex-wrap:nowrap"><button class="btn ' + (f ? 'fav' : '') + '" data-fav="' + t.id + '" aria-label="Favoritar">' + (f ? '★' : '☆') + '</button><button class="btn main" data-open="' + t.id + '">Assistir</button></div></div>'
     }
    
    function det(t) {

    var s = st(t.id),
        i = T.indexOf(t),
        nx = T[i + 1];

    var videoId = t.youtube ? extrairId(t.youtube) : "";

    var player = videoId
        ? `<iframe
            src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}"
            title="${t.t}"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>`
        : '<p>Vídeo ainda não disponível.</p>';

    var h = '<button class="back" data-back>⏎ Voltar</button>' +
        '<div class="video">' + player + '</div>' +
        card(t);

    return h;
}
    function list(a, intro, empty) { return a.length ? (intro ? '<p class="sub">' + intro + '</p>' : '') + a.map(card).join('') : '<p class="empty">' + empty + '</p>' }
    function home() {
      var go = T.filter(function (t) { return st(t.id).op && !fin(t) })[0], h = '<h1>Olá! O que você quer aprender hoje?</h1>';
      if (go) h += '<h2 class="lv">Continue de onde parou</h2>' + card(go);
      h += '<h2 class="lv">Escolha um caminho</h2>' + LV.map(function (v, k) { var n = T.filter(function (t) { return t.l === k }); return '<button class="lvbtn" data-go="trilhas"><span class="e">' + v.e + '</span><span><b>' + v.n + '</b><small>' + v.d + ' · ' + n.filter(fin).length + ' de ' + n.length + ' concluídos</small></span></button>' }).join('');
      h += '<button class="lvbtn" data-go="safe"><span class="e">⚠️</span><span><b>Cuidado com golpes</b><small>Aprenda a se proteger</small></span></button>';
      h += '<button class="lvbtn" data-go="help"><span class="e">🤝</span><span><b>Preciso de ajuda</b><small>Chame alguém da família</small></span></button>';
      h += '<h2 class="lv">Mais procurados</h2>' + ['pix', 'audio', 'video', 'print'].map(function (i) { return mini(get(i)) }).join('');
      return h;
    }
    function trilhas() { return '<h1>Trilhas de aprendizado</h1><p class="sub">Comece pelo primeiro nível e vá no seu ritmo.</p>' + LV.map(function (v, k) { var n = T.filter(function (t) { return t.l === k }); return '<h2 class="lv">' + v.e + ' ' + v.n + '</h2><p class="sub">' + n.filter(fin).length + ' de ' + n.length + ' concluídos</p>' + n.map(mini).join('') }).join('') }
    function safe() {
      return '<h1>Cuidado com golpes</h1><p class="sub">Toque em cada pergunta para ler a resposta.</p>' +
        [['“Oi, mãe, troquei de número”', 'Golpistas fingem ser um filho ou parente. Antes de mandar dinheiro, ligue para o número antigo ou faça uma pergunta que só a pessoa saberia responder.'],
        ['Ligaram dizendo ser do banco', 'O banco nunca pede senha, cartão ou código por telefone. Desligue e ligue você mesmo para o número que está no verso do cartão.'],
        ['Recebi um link com prêmio', 'Não toque em links de desconhecidos, mesmo prometendo dinheiro, prêmios ou promoções. Se parece bom demais, é golpe.'],
        ['Pediram o código que chegou por SMS', 'Esse código é só seu. Nenhuma empresa precisa dele. Quem pede está tentando entrar na sua conta.'],
        ['Caí em um golpe, e agora?', 'Ligue para o banco na hora, troque as senhas, registre um boletim de ocorrência e avise a família. Quanto antes, melhor.']].map(function (x) { return '<details><summary>' + x[0] + '</summary><p>' + x[1] + '</p></details>' }).join('') +
        '<div class="safe"><b>Regra de ouro</b>Na dúvida, não faça. Pare e pergunte a alguém de confiança.</div>'
    }
    function help() {
      var u = ''; try { u = 'https://wa.me/?text=' + encodeURIComponent('Olá! Olha este site que ensina a usar o celular passo a passo: ' + location.href) } catch (e) { }
      return '<h1>Preciso de ajuda</h1><div class="card"><h2>Chame alguém da família</h2><p>Envie o link do Passo certo para um parente e peça para ele ajudar você.</p><a class="btn wa" href="' + u + '" target="_blank" rel="noopener">Enviar pelo WhatsApp</a></div><h2 class="lv">Problemas comuns</h2>' +
        [['Meu celular está sem espaço', 'Vá em “Configurações”, toque em “Armazenamento” e apague fotos, vídeos e aplicativos que você não usa mais.'],
        ['Estou sem internet', 'Abra o atalho do topo e confira se o Wi-Fi ou os dados móveis estão ligados. Se continuar, reinicie o celular.'],
        ['A tela travou', 'Segure o botão de ligar por cerca de 10 segundos até o celular reiniciar.'],
        ['Esqueci uma senha', 'Na tela de entrada do aplicativo, toque em “Esqueci minha senha” e siga as instruções. Nunca conte a senha para outra pessoa.']].map(function (x) { return '<details><summary>' + x[0] + '</summary><p>' + x[1] + '</p></details>' }).join('')
    }
    function render() {
      document.documentElement.style.setProperty('--sc', sc);
